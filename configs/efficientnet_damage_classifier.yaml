seed: 42
device: "cuda"

dataset:
  name: "xbd_crops"
  processed_dir: "data/processed/xbd"
  crops_csv: "data/processed/xbd/metadata/buildings.csv"
  split_csv: "data/processed/xbd/metadata/splits_event_aware.csv"
  image_size: 224
  batch_size: 32
  num_workers: 2

model:
  name: "efficientnet_classifier"
  backbone: "efficientnet_b3"
  pretrained: true
  num_classes: 4

training:
  epochs: 30
  lr: 1.0e-4
  weight_decay: 1.0e-4
  scheduler: "cosine"
  mixed_precision: true
  early_stopping_patience: 7
  save_best_metric: "macro_f1"

loss:
  type: "weighted_ce"
  compute_class_weights: true

augmentation:
  horizontal_flip: 0.5
  vertical_flip: 0.5
  rotate: 15
  brightness_contrast: 0.2
  normalize: true
