seed: 42
device: "cuda"

dataset:
  name: "xbd"
  processed_dir: "data/processed/xbd"
  image_size: 512
  batch_size: 4
  num_workers: 4
  split_csv: "data/processed/xbd/metadata/splits_event_aware.csv"
  mask_type: "building_binary"

task:
  name: "building_segmentation"
  num_classes: 2
  ignore_index: 255

model:
  name: "segformer"
  model_name: "nvidia/segformer-b2-finetuned-ade-512-512"
  num_labels: 2
  in_channels: 3

training:
  epochs: 50
  lr: 0.00006
  weight_decay: 0.0001
  mixed_precision: true
  early_stopping_patience: 10
  save_best_metric: "iou"

loss:
  ce_weighted: false
  dice_weight: 0.5

augmentation:
  horizontal_flip: 0.5
  vertical_flip: 0.5
  rotate90: 0.5
  brightness_contrast: 0.2
  normalize: true
