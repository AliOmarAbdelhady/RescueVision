seed: 42
device: "cuda"

dataset:
  name: "xbd"
  processed_dir: "data/processed/xbd"
  image_size: 512
  batch_size: 4
  num_workers: 4
  split_csv: "data/processed/xbd/metadata/splits_event_aware.csv"

task:
  name: "change_detection"
  num_classes: 1

model:
  name: "changeformer"
  encoder_name: "resnet34"
  pretrained: true
  classes: 1

training:
  epochs: 50
  lr: 0.0001
  weight_decay: 0.00001
  mixed_precision: true
  early_stopping_patience: 10
  save_best_metric: "f1"

loss:
  bce_weight: 0.5
  dice_weight: 0.5

augmentation:
  horizontal_flip: 0.5
  vertical_flip: 0.5
  rotate90: 0.5
  brightness_contrast: 0.2
  normalize: true
