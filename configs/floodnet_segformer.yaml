seed: 42
device: "cuda"

dataset:
  name: "floodnet"
  raw_dir: "data/raw/floodnet"
  processed_dir: "data/processed/floodnet"
  image_size: 512
  batch_size: 4
  num_workers: 2
  num_classes: 10

model:
  name: "segformer"
  backbone: "nvidia/segformer-b2-finetuned-ade-512-512"
  num_labels: 10
  ignore_mismatched_sizes: true

training:
  epochs: 50
  lr: 6.0e-5
  weight_decay: 1.0e-4
  scheduler: "cosine"
  mixed_precision: true
  early_stopping_patience: 8
  save_best_metric: "miou"
  gradient_accumulation_steps: 2

loss:
  type: "weighted_ce_dice"
  ce_weight: 0.5
  dice_weight: 0.5
  compute_class_weights: true

augmentation:
  horizontal_flip: 0.5
  vertical_flip: 0.5
  rotate90: 0.5
  brightness_contrast: 0.2
  normalize: true
