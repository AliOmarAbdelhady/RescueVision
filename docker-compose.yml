services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    ports:
      - "8000:8000"
    volumes:
      - ./outputs:/app/outputs
      - ./data:/app/data
    environment:
      - RESCUEVISION_CONFIG=configs/inference.yaml
      - RESCUEVISION_OUTPUTS=outputs
      - RESCUEVISION_FAISS=outputs/faiss
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      target: dashboard
    ports:
      - "5173:5173"
    depends_on:
      - api
